note: >-
  Sempra documents no rate limits, quotas, burst allowances or throttling response
  headers on any public surface. The API program runs on Google Apigee, where Quota and
  SpikeArrest policies are common — but nothing about them is published, and the routed
  /v1 proxy rejects every anonymous request at the OAuthV2 policy (HTTP 401) before a
  quota policy could emit a header, so no live rate-limit signal is observable. No
  X-RateLimit-*, RateLimit-* or Retry-After header appeared on any response captured on
  2026-09-04. This is a documented absence, not an inference that limits do not exist.
