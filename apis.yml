apis:
  - name: Sempra Developer Portal APIs
    description: >-
      Sempra runs a Google Apigee API program. api.sempra.com is the Apigee runtime
      gateway and developer.sempra.com is an Apigee integrated developer portal (Apigee
      organization "sempra", site id "sempra-prod"). Both hosts present DigiCert EV
      certificates issued to O=Sempra Energy, L=San Diego, ST=California, which is how
      ownership was established. Re-probed 2026-09-04: the portal still publishes nothing
      to anonymous visitors — its own catalog endpoint
      /portals/api/sites/sempra-prod/liveportal/apis returns HTTP 200 with "apiDocs": []
      and "apiProducts": [], and its header menu is exactly two items, "APIs" and
      "Log In". No OpenAPI, reference, operation list, scope, plan or rate limit is
      publicly reachable. Anonymous probing does establish a live proxy routed at
      basepath /v1: every path under it (/v1, /v1/graphql, /v1/token, /v1/openapi.json)
      returns HTTP 401 with an Apigee oauth.v2.InvalidAccessToken fault and a
      WWW-Authenticate Bearer challenge, while /, /v2/graphql, /oauth/token and
      /openapi.json return the Apigee messaging.adaptors.http.flow.ApplicationNotFound
      not-routed 404. The gateway advertises GET, PUT, POST, DELETE, OPTIONS and PATCH
      through a wildcard CORS policy, so a real read/write surface sits behind the OAuth
      wall — but no operation, schema or scope is published.
    humanURL: https://developer.sempra.com
