description: >-
  Sempra is a San Diego-headquartered North American energy infrastructure holding
  company and a Fortune 500 constituent, operating regulated utilities and energy
  infrastructure across California, Texas and Mexico. Its businesses include San Diego
  Gas & Electric and Southern California Gas Company in California, an ownership
  interest in Oncor Electric Delivery in Texas, and Sempra Infrastructure, which
  develops LNG export terminals, natural gas pipelines and renewable generation in
  North America. Sempra operates a Google Apigee API program — an OAuth-protected
  gateway at api.sempra.com and an integrated developer portal at developer.sempra.com
  — and runs sibling Apigee organizations for its California utilities at
  developer.sdge.com (site sdge-prod) and developer.socalgas.com (site socalgas-prod).
  None of the three portals publishes an API product, contract, reference or price to an
  unauthenticated visitor, so the entire integration surface sits behind portal
  registration.
